<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة سعود التفاعلية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 لعبة سعود التفاعلية</h1>
        <p>مرحباً بك في اللعبة! انتظر بدء الجولة من لوحة التحكم.</p>
        
        <div class="timer" id="timer">15</div>

        <button class="btn" onclick="startTimer()">ابدأ العداد</button>

        <div id="status">جاري الاتصال بـ Firebase...</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AiZaSyAC3Keb8UpONcT7Nj_shA1CYZDY3cJdq1w",
            authDomain: "fm-game-ee133.firebaseapp.com",
            databaseURL: "https://fm-game-ee133-default-rtdb.firebaseio.com",
            projectId: "fm-game-ee133",
            storageBucket: "fm-game-ee133.firebasestorage.app",
            messagingSenderId: "661072425550",
            appId: "1:661072425550:web:32804ea46fce82c323091f",
            measurementId: "G-E95L0N336E"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        document.getElementById('status').innerText = "تم الاتصال بنجاح بقاعدة البيانات!";

        // وظيفة العداد التنازلي (15 ثانية)
        let timeLeft = 15;
        let timerId;

        function startTimer() {
            clearInterval(timerId);
            timeLeft = 15;
            document.getElementById('timer').innerText = timeLeft;
            
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    document.getElementById('timer').innerText = "انتهى الوقت!";
                }
            }, 1000);
        }
    </script>
</body>
</html>
