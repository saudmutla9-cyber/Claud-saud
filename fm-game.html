<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B2BB8">
<title>تحدي إدارة المرافق | Facilities Management Challenge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #4B2BB8;
    --bg-deep: #34198F;
    --card: #FFFFFF;
    --ink: #23174A;
    --muted: #6D6590;
    --c0: #F0435A;
    --c1: #1E9BF0;
    --c2: #FFB020;
    --c3: #1DB36B;
    --gold: #FFD23F;
    --silver: #C9D3E6;
    --bronze: #E59A5C;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100vh; color: #fff;
    background-color: var(--bg);
    background-image: radial-gradient(rgba(255,255,255,.09) 2px, transparent 2px);
    background-size: 28px 28px;
    font-family: "Baloo Bhaijaan 2", "Tajawal", Tahoma, "Segoe UI", sans-serif;
    font-size: 18px; line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }
  .screen { animation: pop .35s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.98); } }

  /* Bilingual text */
  .bi { display: inline-flex; flex-direction: column; line-height: 1.2; }
  .bi .en { font-size: .6em; opacity: .8; font-weight: 500; }
  .center { text-align: center; }
  .center .bi { align-items: center; }

  h1, h2, h3 { margin: 0; font-weight: 800; }
  .muted { color: var(--muted); }
  .card { background: var(--card); color: var(--ink); border-radius: 26px; padding: 26px; box-shadow: 0 8px 0 rgba(0,0,0,.15); }

  .btn {
    font: inherit; font-weight: 800; border: 0; cursor: pointer; border-radius: 18px;
    background: var(--gold); color: var(--ink); padding: 14px 28px; font-size: 1.15rem;
    box-shadow: 0 6px 0 #C79A10; transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #C79A10; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.big { width: 100%; font-size: 1.4rem; padding: 16px; }
  .btn.ghost { background: rgba(255,255,255,.16); color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.2); }
  .pill { background: rgba(255,255,255,.16); border-radius: 999px; padding: 8px 18px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }

  /* Brand */
  .brand { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 10px 0 28px; text-align: center; }
  .brand h1 { font-size: clamp(1.8rem, 4.5vw, 3rem); }
  .logo { width: 72px; height: 72px; border-radius: 22px; background: var(--gold); display: grid; place-items: center; font-size: 40px; transform: rotate(-6deg); box-shadow: 0 6px 0 #C79A10; flex-shrink: 0; }

  /* Host lobby */
  .lobby-grid { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; gap: 24px; }
  .join-card { text-align: center; }
  .join-card > p { margin: 0 0 14px; font-size: 1.3rem; font-weight: 700; }
  .qr { background: #fff; padding: 12px; border-radius: 18px; border: 4px dashed var(--c1); display: inline-block; min-width: 200px; min-height: 200px; }
  .qr img, .qr canvas { display: block; width: 100%; max-width: 280px; height: auto; }
  .code-label { margin-top: 16px; color: var(--muted); font-size: .9rem; }
  .code { font-size: 2.6rem; font-weight: 800; letter-spacing: .18em; color: var(--bg); direction: ltr; }
  .join-link { display: block; margin-top: 6px; font-size: .78rem; color: var(--c1); word-break: break-all; direction: ltr; }
  .players-card { display: flex; flex-direction: column; gap: 18px; }
  .players-head { display: flex; align-items: center; justify-content: space-between; font-size: 1.4rem; font-weight: 800; }
  .count { background: var(--bg); color: #fff; border-radius: 14px; min-width: 52px; text-align: center; padding: 2px 14px; font-size: 1.6rem; }
  .chips { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; min-height: 180px; }
  .chip { padding: 8px 16px; border-radius: 999px; font-weight: 700; color: #fff; animation: chipIn .35s cubic-bezier(.3,1.6,.5,1); }
  .chip.off { opacity: .35; }
  @keyframes chipIn { from { transform: scale(0); } }
  .status { text-align: center; margin-top: 18px; opacity: .85; }
  .warn { background: #FFF3CD; color: #7A5200; border-radius: 14px; padding: 10px 14px; font-size: .85rem; margin-top: 14px; }

  /* Host question */
  .q-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
  .ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255,255,255,.18); }
  .ring .prog { stroke: var(--gold); transition: stroke-dashoffset .1s linear, stroke .3s; }
  .ring.low .prog { stroke: var(--c0); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.2rem; font-weight: 800; }
  .q-card { background: var(--card); color: var(--ink); border-radius: 26px; padding: 28px 32px; text-align: center; font-size: clamp(1.5rem, 3.4vw, 2.3rem); font-weight: 800; box-shadow: 0 8px 0 rgba(0,0,0,.15); }
  .q-card .bi { align-items: center; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  .opt {
    position: relative; display: flex; align-items: center; gap: 16px; border-radius: 22px; padding: 22px 24px;
    font-size: clamp(1.1rem, 2.4vw, 1.6rem); font-weight: 700; color: #fff; box-shadow: 0 7px 0 rgba(0,0,0,.2);
    transition: opacity .3s, transform .3s; text-align: start;
  }
  .c0 { background: var(--c0); } .c1 { background: var(--c1); } .c2 { background: var(--c2); color: var(--ink); } .c3 { background: var(--c3); }
  .shape { font-size: 1.5em; line-height: 1; flex-shrink: 0; }
  .opt .cnt { margin-inline-start: auto; background: rgba(0,0,0,.18); border-radius: 12px; padding: 2px 12px; font-weight: 800; }
  .opt.dim { opacity: .28; transform: scale(.97); }
  .opt.right { outline: 5px solid #fff; transform: scale(1.02); }
  .opt.right::after { content: "✔"; position: absolute; top: -14px; inset-inline-end: -10px; background: #fff; color: var(--c3); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.4rem; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .fact { margin-top: 20px; background: rgba(255,255,255,.14); border-radius: 18px; padding: 14px 20px; display: flex; gap: 12px; align-items: flex-start; }
  .fact .bi .en { font-size: .78em; }
  .host-actions { display: flex; justify-content: center; gap: 12px; margin-top: 24px; }

  /* Leaderboard */
  .board-title { text-align: center; font-size: 2.4rem; margin-bottom: 20px; }
  .board { list-style: none; padding: 0; margin: 0 auto; max-width: 760px; display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 16px; background: var(--card); color: var(--ink); border-radius: 18px; padding: 14px 20px; font-size: 1.35rem; font-weight: 700; box-shadow: 0 5px 0 rgba(0,0,0,.15); animation: slideIn .4s ease-out backwards; }
  .row:nth-child(2) { animation-delay: .08s; } .row:nth-child(3) { animation-delay: .16s; } .row:nth-child(4) { animation-delay: .24s; } .row:nth-child(5) { animation-delay: .32s; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } }
  .rank { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: #EEEAFB; font-weight: 800; flex-shrink: 0; }
  .r1 .rank { background: var(--gold); } .r2 .rank { background: var(--silver); } .r3 .rank { background: var(--bronze); }
  .r1 { outline: 4px solid var(--gold); }
  .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gain { color: var(--c3); font-size: .9rem; direction: ltr; }
  .move { color: var(--c3); font-size: .9rem; }
  .pts { font-weight: 800; color: var(--bg); direction: ltr; }

  /* Final */
  .win-head { text-align: center; }
  .trophy { font-size: 90px; display: inline-block; animation: bounce 1.2s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-14px) rotate(-5deg); } }
  .winner-name { font-size: clamp(2.4rem, 7vw, 4.4rem); font-weight: 800; color: var(--gold); text-shadow: 0 5px 0 rgba(0,0,0,.2); margin: 4px 0 6px; word-break: break-word; }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 14px; margin: 26px auto 30px; max-width: 700px; }
  .place { flex: 1; text-align: center; min-width: 0; }
  .place .pname { font-weight: 800; font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place .pscore { opacity: .85; margin-bottom: 8px; direction: ltr; }
  .block { border-radius: 18px 18px 0 0; display: grid; place-items: start center; padding-top: 12px; font-size: 2.6rem; font-weight: 800; color: var(--ink); animation: rise .7s cubic-bezier(.3,1.4,.5,1) backwards; transform-origin: bottom; }
  .p1 .block { height: 190px; background: var(--gold); animation-delay: .6s; }
  .p2 .block { height: 140px; background: var(--silver); animation-delay: .3s; }
  .p3 .block { height: 100px; background: var(--bronze); }
  @keyframes rise { from { transform: scaleY(0); } }
  .crown { font-size: 2.2rem; }
  .all-list { max-width: 760px; margin: 0 auto; }
  .all-list ol { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; max-height: 320px; overflow-y: auto; }
  .all-list li { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #F4F1FD; border-radius: 12px; font-weight: 700; }

  /* Player */
  .player { max-width: 520px; margin: 0 auto; }
  .p-join { text-align: center; }
  .p-join .logo { margin: 20px auto 16px; }
  .p-join h1 { font-size: 1.8rem; margin-bottom: 24px; }
  .p-join .card { text-align: start; }
  .p-join label { display: block; font-weight: 800; font-size: 1.2rem; margin-bottom: 10px; }
  .p-join input {
    width: 100%; font: inherit; font-size: 1.3rem; font-weight: 700; color: var(--ink);
    border: 3px solid #E4DFF7; border-radius: 16px; padding: 12px 16px; margin-bottom: 18px; outline: none;
  }
  .p-join input:focus { border-color: var(--bg); }
  .err { color: var(--c0); font-weight: 700; margin: 12px 0 0; min-height: 1.3em; text-align: center; }
  .waiting { text-align: center; padding-top: 40px; }
  .waiting .emoji { font-size: 84px; animation: bounce 1.4s ease-in-out infinite; display: inline-block; }
  .waiting h2 { font-size: 1.9rem; margin: 14px 0 8px; }
  .you { display: inline-block; background: var(--gold); color: var(--ink); font-weight: 800; border-radius: 999px; padding: 6px 20px; margin-top: 12px; font-size: 1.2rem; }
  .dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  .p-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .tbar { height: 12px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
  .tfill { height: 100%; width: 100%; background: var(--gold); border-radius: 99px; transition: width .1s linear, background .3s; }
  .tfill.low { background: var(--c0); }
  .tnum { text-align: center; font-size: 1.8rem; font-weight: 800; margin: 6px 0 10px; }
  .player .q-card { font-size: 1.25rem; padding: 18px; border-radius: 20px; }
  .p-opts { display: grid; gap: 12px; margin-top: 16px; }
  .p-opt { font: inherit; border: 0; cursor: pointer; width: 100%; font-size: 1.1rem; padding: 16px 18px; min-height: 72px; }
  .p-opt:active { transform: translateY(3px); }
  .p-opt.picked { outline: 5px solid #fff; }
  .p-opt[disabled] { cursor: default; }
  .p-opts.locked .p-opt:not(.picked) { opacity: .35; }
  .p-note { text-align: center; font-weight: 700; margin-top: 16px; min-height: 1.4em; }

  .result { text-align: center; border-radius: 30px; padding: 34px 22px; margin-top: 10px; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
  .result.good { background: var(--c3); }
  .result.bad { background: var(--c0); }
  .result.none { background: var(--muted); }
  .result .big-icon { width: 96px; height: 96px; border-radius: 50%; background: #fff; display: grid; place-items: center; margin: 0 auto 14px; font-size: 3.2rem; animation: chipIn .45s cubic-bezier(.3,1.6,.5,1); }
  .result.good .big-icon { color: var(--c3); } .result.bad .big-icon { color: var(--c0); } .result.none .big-icon { color: var(--muted); }
  .result h2 { font-size: 2rem; }
  .gainbig { display: inline-block; margin-top: 14px; background: rgba(0,0,0,.18); border-radius: 999px; padding: 6px 22px; font-size: 1.5rem; font-weight: 800; direction: ltr; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stat { background: rgba(255,255,255,.14); border-radius: 18px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 1.8rem; direction: ltr; }
  .answer-box { margin-top: 12px; background: var(--card); color: var(--ink); border-radius: 18px; padding: 12px 16px; text-align: center; }
  .answer-box small { color: var(--muted); display: block; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  @media (max-width: 820px) {
    .lobby-grid { grid-template-columns: 1fr; }
    .opts { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>

<script>
(function () {
  'use strict';

  // ================== CONFIG ==================
  const DURATION = 15000;              // 15 seconds per question
  const PREFIX = 'jisr-fm-challenge-';  // peer id prefix
  const SHAPES = ['▲', '◆', '●', '■'];
  const CHIP_COLORS = ['var(--c0)', 'var(--c1)', 'var(--c3)', '#9B5DE5', '#F15BB5', '#00BBF9', '#FF8C42'];

  const QUESTIONS = [
    { ar: 'ماذا يعني اختصار FM في بيئة العمل؟', en: 'What does "FM" stand for in the workplace?',
      options: [['إدارة المرافق', 'Facilities Management'], ['المراقبة المالية', 'Financial Monitoring'], ['التسويق الميداني', 'Field Marketing'], ['صيانة الأسطول', 'Fleet Maintenance']],
      correct: 0, fact: ['إدارة المرافق تضمن أن بيئة العمل آمنة ومريحة وفعّالة لكل الموظفين.', 'FM makes sure the workplace is safe, comfortable and efficient for everyone.'] },
    { ar: 'أي نوع من الصيانة يتم وفق جدول مسبق لمنع الأعطال؟', en: 'Which maintenance type is scheduled in advance to prevent breakdowns?',
      options: [['الصيانة التصحيحية', 'Corrective maintenance'], ['الصيانة الوقائية', 'Preventive maintenance'], ['الصيانة الطارئة', 'Emergency maintenance'], ['الصيانة المؤجلة', 'Deferred maintenance']],
      correct: 1, fact: ['الصيانة الوقائية تقلل الأعطال المفاجئة وتطيل عمر الأصول.', 'Preventive maintenance reduces sudden failures and extends asset life.'] },
    { ar: 'ماذا يعني اختصار HVAC؟', en: 'What does HVAC stand for?',
      options: [['التيار المتردد عالي الجهد', 'High Voltage Alternating Current'], ['التحكم بدخول المركبات الثقيلة', 'Heavy Vehicle Access Control'], ['التدفئة والتهوية والتكييف', 'Heating, Ventilation & Air Conditioning'], ['التنظيف المنزلي بالمكنسة', 'Home Vacuum & Cleaning']],
      correct: 2, fact: ['أنظمة HVAC من أكبر مستهلكي الطاقة في المباني المكتبية.', 'HVAC systems are among the biggest energy users in office buildings.'] },
    { ar: 'ماذا يعني SLA في العقود مع الموردين؟', en: 'What is an SLA in vendor contracts?',
      options: [['تدقيق إنارة السلامة', 'Safety Lighting Audit'], ['حساب الخدمات اللوجستية', 'Supply Logistics Account'], ['اعتماد إجازات الموظفين', 'Staff Leave Approval'], ['اتفاقية مستوى الخدمة', 'Service Level Agreement']],
      correct: 3, fact: ['اتفاقية مستوى الخدمة تحدد الجودة وأوقات الاستجابة المتوقعة من المورد.', 'An SLA defines the quality and response times expected from a vendor.'] },
    { ar: 'ما هو المعيار الدولي الخاص بإدارة المرافق؟', en: 'Which international standard covers Facility Management?',
      options: [['ISO 41001', 'ISO 41001'], ['ISO 9001', 'ISO 9001'], ['ISO 14001', 'ISO 14001'], ['ISO 27001', 'ISO 27001']],
      correct: 0, fact: ['ISO 41001 هو نظام الإدارة الدولي المخصص لإدارة المرافق.', 'ISO 41001 is the international management system standard for FM.'] },
    { ar: 'أي مما يلي يُعد من "الخدمات الناعمة" في إدارة المرافق؟', en: 'Which of these is a "soft service" in FM?',
      options: [['الأنظمة الكهربائية', 'Electrical systems'], ['السباكة', 'Plumbing'], ['النظافة', 'Cleaning'], ['أنظمة مكافحة الحريق', 'Fire protection systems']],
      correct: 2, fact: ['الخدمات الناعمة تخدم الأشخاص (نظافة، استقبال، ضيافة)، والصلبة تخدم المبنى.', 'Soft services support people (cleaning, reception); hard services support the building.'] },
    { ar: 'لماذا يُستخدم نظام CAFM؟', en: 'What is a CAFM system used for?',
      options: [['إدارة الرواتب', 'Running payroll'], ['إدارة بيانات المرافق والصيانة والمساحات رقمياً', 'Managing facilities, maintenance & space digitally'], ['إطلاق الحملات التسويقية', 'Launching marketing campaigns'], ['المحاسبة فقط', 'Accounting only']],
      correct: 1, fact: ['CAFM تعني إدارة المرافق بمساعدة الحاسب، وتربط الأصول وأوامر العمل والمساحات في مكان واحد.', 'CAFM (Computer-Aided FM) links assets, work orders and space in one place.'] },
    { ar: 'ما الأولوية الأهم أثناء إخلاء المبنى؟', en: 'What is the top priority during a building evacuation?',
      options: [['حفظ المستندات', 'Saving documents'], ['إطفاء أجهزة الحاسب', 'Shutting down computers'], ['إنهاء الاجتماعات', 'Finishing meetings'], ['سلامة الأشخاص', 'People\'s safety']],
      correct: 3, fact: ['تمارين الإخلاء الدورية تجعل الجميع يعرف مخارج الطوارئ ونقاط التجمع.', 'Regular evacuation drills help everyone know the exits and assembly points.'] },
    { ar: 'ما نوع طفاية الحريق المناسبة لحرائق الأجهزة الكهربائية؟', en: 'Which extinguisher suits electrical fires?',
      options: [['ثاني أكسيد الكربون CO2', 'Carbon dioxide (CO2)'], ['الماء', 'Water'], ['الرغوة', 'Foam'], ['الكيميائية الرطبة', 'Wet chemical']],
      correct: 0, fact: ['طفاية CO2 لا توصل الكهرباء ولا تترك بقايا على الأجهزة.', 'CO2 does not conduct electricity and leaves no residue on equipment.'] },
    { ar: 'ماذا تعني "دورة حياة الأصل"؟', en: 'What does "Asset Lifecycle" mean?',
      options: [['فترة الضمان فقط', 'The warranty period only'], ['ساعات التشغيل اليومية', 'Daily operating hours'], ['مراحل الأصل من الشراء حتى الاستبعاد', 'An asset\'s stages from purchase to disposal'], ['سعر شراء الأصل', 'The asset\'s purchase price']],
      correct: 2, fact: ['إدارة دورة حياة الأصل تساعد على معرفة الوقت المناسب للصيانة أو الاستبدال.', 'Lifecycle management shows when to maintain or replace an asset.'] },
    { ar: 'ما المؤشر الذي يقيس مدى استخدام المساحات المكتبية؟', en: 'Which KPI measures how much office space is actually used?',
      options: [['معدل دوران الموظفين', 'Turnover rate'], ['نسبة استغلال المساحات', 'Space utilization'], ['انحراف الميزانية', 'Budget variance'], ['عدد الموظفين', 'Headcount']],
      correct: 1, fact: ['قياس استغلال المساحات يساعد على تخطيط المكاتب وتقليل التكاليف.', 'Tracking space utilization helps plan offices and cut costs.'] },
    { ar: 'ما أسرع طريقة لتقليل استهلاك الكهرباء في المكتب؟', en: 'What is a quick win to cut office electricity use?',
      options: [['ترك التكييف يعمل 24 ساعة', 'Running AC 24/7'], ['إضافة طابعات أكثر', 'Adding more printers'], ['مولدات أكبر', 'Bigger generators'], ['إنارة LED بحساسات حركة', 'LED lighting with motion sensors']],
      correct: 3, fact: ['إنارة LED مع حساسات الحركة قد توفر جزءاً كبيراً من تكلفة الإنارة.', 'LED lighting with motion sensors can save a large share of lighting costs.'] },
    { ar: 'ما هو "أمر العمل" في إدارة المرافق؟', en: 'What is a "Work Order" in FM?',
      options: [['طلب رسمي لتنفيذ مهمة صيانة أو خدمة', 'A formal request to carry out a maintenance or service task'], ['فاتورة شراء', 'A purchase invoice'], ['عقد موظف', 'An employee contract'], ['جدول أعمال اجتماع', 'A meeting agenda']],

      options: [['جودة الهواء', 'Air quality'], ['من يدخل أي منطقة ومتى', 'Who can enter which areas and when'], ['رسوم المواقف', 'Parking fees'], ['المستلزمات المكتبية', 'Office supplies']],
      correct: 1, fact: ['أنظمة الدخول تحمي الموظفين والأصول وتسجل حركة الدخول والخروج.', 'Access control protects people and assets and logs entries and exits.'] },
    { ar: 'ماذا تشمل "التكلفة الإجمالية للملكية" (TCO)؟', en: 'What does Total Cost of Ownership (TCO) include?',
      options: [['سعر الشراء فقط', 'Purchase price only'], ['تكلفة التركيب فقط', 'Installation only'], ['الشراء والتشغيل والصيانة والاستبعاد', 'Purchase, operation, maintenance & disposal'], ['الإيجار السنوي فقط', 'Annual rent only']],
      correct: 2, fact: ['الأرخص عند الشراء ليس دائماً الأرخص على المدى الطويل.', 'The cheapest to buy is not always the cheapest over its life.'] }
  ];

  const MSG_RIGHT = [
    ['فنان! 🎨', 'Brilliant!'],
    ['مستقبلك إدارة المرافق! 🏢', 'Your future is in Facilities Management!'],
    ['كفو! 👏', 'Well done!'],
    ['أسطورة المرافق! ⭐', 'FM legend!'],
    ['إجابة خبير! 💡', 'Expert answer!']
  ];
  const MSG_WRONG = [
    ['لا تستسلم، الجاي أفضل! 💪', 'Don\'t give up, the next one is better!'],
    ['كنت قريب! 🤏', 'So close!'],
    ['حاول مرة ثانية! 🔁', 'Try again next time!'],
    ['ولا يهمك، ركّز على اللي بعده 🎯', 'No worries, focus on the next one!']
  ];
  const MSG_NONE = ['انتهى الوقت! ⏰', 'Time\'s up!'];

  // ================== HELPERS ==================
  const app = document.getElementById('app');
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const bi = (ar, en, cls = '') => `<span class="bi ${cls}"><span class="ar">${ar}</span><span class="en" dir="ltr">${en}</span></span>`;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const render = (html) => { app.innerHTML = html; };

  function libsOk() {
    if (typeof Peer === 'undefined') {
      render(`<div class="screen card center" style="margin-top:60px">
        <h2>${bi('تعذّر تحميل مكتبة الاتصال', 'Could not load the connection library')}</h2>
        <p class="muted">${bi('تحقق من اتصال الإنترنت ثم حدّث الصفحة.', 'Check your internet connection and refresh the page.')}</p></div>`);
      return false;
    }
    return true;
  }

  // ================== CONFETTI ==================
  function confetti(duration = 5000) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.getElementById('confetti');
    const ctx = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const colors = ['#F0435A', '#1E9BF0', '#FFB020', '#1DB36B', '#FFD23F', '#F15BB5', '#FFFFFF'];
    const parts = Array.from({ length: 200 }, () => ({
      x: Math.random() * c.width, y: -20 - Math.random() * c.height,
      w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
      vx: -2 + Math.random() * 4, vy: 2.5 + Math.random() * 4,
      r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4,
      color: pick(colors)
    }));
    const end = performance.now() + duration;
    (function frame(t) {
      ctx.clearRect(0, 0, c.width, c.height);
      let alive = false;
      parts.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if (p.y > c.height + 20 && t < end) { p.y = -20; p.x = Math.random() * c.width; }
        if (p.y < c.height + 20) alive = true;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      if (alive) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
    })(performance.now());
  }

  // ================== ROUTING ==================
  const params = new URLSearchParams(location.search);
  const ROOM = (params.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (ROOM) initPlayer(ROOM); else initHost();

  // =====================================================
  //                        HOST
  // =====================================================
  function initHost() {
    let peer = null, roomCode = '', joinUrl = '';
    let phase = 'lobby', qIndex = -1, qStart = 0, timerId = null;
    const players = new Map(); // id -> {id,name,score,conn,connected,answer,elapsed,lastPoints,lastCorrect,rank,prevRank,color}
    let colorIdx = 0;

    if (!libsOk()) return;
    renderLobby();
    createPeer();

    window.addEventListener('beforeunload', (e) => {
      if (phase !== 'lobby' && phase !== 'final') { e.preventDefault(); e.returnValue = ''; }
    });

    function randomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = ''; for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    function createPeer() {
      const code = randomCode();
      peer = new Peer(PREFIX + code, { debug: 0 });
      peer.on('open', () => {
        roomCode = code;
        joinUrl = location.origin + location.pathname + '?room=' + code;
        showRoom();
      });
      peer.on('connection', setupConn);
      peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') { peer.destroy(); createPeer(); return; }
        const st = $('#hostStatus');
        if (st) st.innerHTML = bi('حدث خطأ في الاتصال، حدّث الصفحة وحاول مجدداً.', 'Connection error. Refresh the page and try again.');
        console.error(err);
      });
    }

    function setupConn(conn) {
      conn.on('data', (msg) => handleMsg(conn, msg));
      conn.on('close', () => {
        for (const p of players.values()) {
          if (p.conn === conn) { p.connected = false; p.conn = null; }
        }
        updateLobbyPlayers(); updateAnswered(); checkAllAnswered();
      });
    }

    function send(p, msg) { if (p.conn && p.connected) { try { p.conn.send(msg); } catch (e) {} } }
    function connected() { return [...players.values()].filter(p => p.connected); }
    function ranking() { return [...players.values()].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name)); }

    function handleMsg(conn, msg) {
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'join') {
        const pid = String(msg.pid || '').slice(0, 40);
        const name = String(msg.name || '').trim().replace(/\s+/g, ' ').slice(0, 20);
        if (!pid) return;
        let p = players.get(pid);
        if (!p) {
          if (!name) return;
          const taken = [...players.values()].some(x => x.name.toLowerCase() === name.toLowerCase());
          if (taken) { conn.send({ type: 'error', code: 'name' }); return; }
          p = { id: pid, name, score: 0, answer: null, elapsed: null, lastPoints: 0, lastCorrect: false, rank: null, prevRank: null, color: CHIP_COLORS[colorIdx++ % CHIP_COLORS.length] };
          players.set(pid, p);
        }
        p.conn = conn; p.connected = true;
        conn.send({ type: 'welcome', name: p.name, score: p.score });
        sendState(p);
        updateLobbyPlayers(); updateAnswered();
        return;
      }
      const p = [...players.values()].find(x => x.conn === conn);
      if (!p) return;
      if (msg.type === 'answer' && phase === 'question' && msg.q === qIndex && p.answer === null) {
        const choice = Number(msg.choice);
        if (![0, 1, 2, 3].includes(choice)) return;
        const hostEl = Date.now() - qStart;
        let el = Number(msg.elapsed);
        if (!isFinite(el) || el < 0 || el > hostEl) el = hostEl;
        p.answer = choice; p.elapsed = Math.min(el, DURATION);
        updateAnswered(); checkAllAnswered();
      }
    }

    function qPayload(remaining) {
      const q = QUESTIONS[qIndex];
      return { type: 'question', q: qIndex, n: qIndex + 1, total: QUESTIONS.length, ar: q.ar, en: q.en, options: q.options, remaining };
    }

    function sendState(p) {
      if (phase === 'lobby') send(p, { type: 'lobby' });
      else if (phase === 'question') {
        if (p.answer === null) send(p, qPayload(Math.max(0, DURATION - (Date.now() - qStart))));
        else send(p, { type: 'wait' });
      } else if (phase === 'reveal' || phase === 'board') sendResult(p);
      else if (phase === 'final') sendFinal(p, ranking());
    }

    // ---------- Lobby ----------
    function renderLobby() {
      render(`<div class="screen">
        <div class="brand"><div class="logo">🏢</div><h1>${bi('تحدي إدارة المرافق', 'Facilities Management Challenge')}</h1></div>
        <div class="lobby-grid">
          <div class="card join-card">
            <p>${bi('امسح الرمز للانضمام', 'Scan to join')}</p>
            <div id="qr" class="qr"></div>
            <div class="code-label">${bi('رمز الغرفة', 'Room code')}</div>
            <div class="code" id="roomCode">· · ·</div>
            <a id="joinLink" class="join-link" target="_blank" rel="noopener"></a>
            ${location.protocol === 'file:' ? `<div class="warn">${bi('ارفع الملف على GitHub Pages ليعمل الباركود مع اللاعبين.', 'Host this file on GitHub Pages so players can join via the QR code.')}</div>` : ''}
          </div>
          <div class="card players-card">
            <div class="players-head">${bi('اللاعبون', 'Players')}<span class="count" id="pCount">0</span></div>
            <div class="chips" id="chips"></div>
            <button class="btn big" id="startBtn" disabled>${bi('ابدأ اللعبة', 'Start game')}</button>
          </div>
        </div>
        <p class="status" id="hostStatus">${bi('جاري تجهيز الغرفة…', 'Preparing the room…')}</p>
      </div>`);
      $('#startBtn').addEventListener('click', startGame);
      if (roomCode) showRoom();
      updateLobbyPlayers();
    }

    function showRoom() {
      if (phase !== 'lobby') return;
      const qrEl = $('#qr');
      if (!qrEl) return;
      qrEl.innerHTML = '';
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrEl, { text: joinUrl, width: 280, height: 280, colorDark: '#23174A', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M });
      } else {
        qrEl.innerHTML = `<p class="muted">${bi('استخدم الرابط أدناه', 'Use the link below')}</p>`;
      }
      $('#roomCode').textContent = roomCode;
      const a = $('#joinLink'); a.href = joinUrl; a.textContent = joinUrl;
      $('#hostStatus').innerHTML = bi('الغرفة جاهزة! ابدأ اللعبة بعد انضمام اللاعبين', 'Room is ready! Start once players have joined');
    }

    function updateLobbyPlayers() {
      if (phase !== 'lobby') return;
      const chips = $('#chips'); if (!chips) return;
      const list = [...players.values()];
      chips.innerHTML = list.length
        ? list.map(p => `<span class="chip ${p.connected ? '' : 'off'}" style="background:${p.color}">${esc(p.name)}</span>`).join('')
        : `<p class="muted">${bi('بانتظار انضمام اللاعبين…', 'Waiting for players to join…')}</p>`;
      $('#pCount').textContent = connected().length;
      $('#startBtn').disabled = connected().length === 0;
    }

    // ---------- Game ----------
    function startGame() {
      if (!connected().length) return;
      players.forEach(p => { p.score = 0; p.rank = null; p.prevRank = null; });
      qIndex = -1;
      nextQuestion();
    }

    function nextQuestion() {
      qIndex++;
      if (qIndex >= QUESTIONS.length) { finish(); return; }
      phase = 'question';
      players.forEach(p => { p.answer = null; p.elapsed = null; p.lastPoints = 0; p.lastCorrect = false; });
      qStart = Date.now();
      players.forEach(p => send(p, qPayload(DURATION)));
      renderQuestion(false);
      clearInterval(timerId);
      timerId = setInterval(tick, 100);
    }

    function tick() {
      const left = Math.max(0, DURATION - (Date.now() - qStart));
      const secs = Math.ceil(left / 1000);
      const num = $('#tNum'), prog = $('#ringProg'), ring = $('#ring');
      if (num) num.textContent = secs;
      if (prog) prog.style.strokeDashoffset = String(276.5 * (1 - left / DURATION));
      if (ring) ring.classList.toggle('low', secs <= 5);
      if (left <= 0) reveal();
    }

    function updateAnswered() {
      if (phase !== 'question') return;
      const el = $('#ansCount');
      if (el) el.textContent = `${[...players.values()].filter(p => p.answer !== null).length} / ${connected().length}`;
    }

    function checkAllAnswered() {
      if (phase !== 'question') return;
      const active = connected();
      if (active.length && active.every(p => p.answer !== null)) {
        const qi = qIndex;
        setTimeout(() => { if (phase === 'question' && qIndex === qi) reveal(); }, 700);
      }
    }

    function reveal() {
      if (phase !== 'question') return;
      clearInterval(timerId);
      phase = 'reveal';
      const q = QUESTIONS[qIndex];
      ranking().forEach((p, i) => { p.prevRank = qIndex === 0 ? null : i + 1; });
      players.forEach(p => {
        if (p.answer === q.correct) {
          p.lastCorrect = true;
          p.lastPoints = Math.round(500 + 500 * (1 - p.elapsed / DURATION)); // 500–1000, faster = more
          p.score += p.lastPoints;
        } else { p.lastCorrect = false; p.lastPoints = 0; }
      });
      ranking().forEach((p, i) => { p.rank = i + 1; });
      players.forEach(sendResult);
      renderQuestion(true);
    }

    function sendResult(p) {
      const q = QUESTIONS[qIndex];
      const leader = ranking()[0];
      send(p, {
        type: 'result', answered: p.answer !== null, isCorrect: p.lastCorrect, points: p.lastPoints,
        score: p.score, rank: p.rank, total: players.size, leader: leader ? leader.name : '',
        correct: q.options[q.correct], n: qIndex + 1, totalQ: QUESTIONS.length
      });
    }

    function renderQuestion(revealed) {
      const q = QUESTIONS[qIndex];
      const counts = [0, 0, 0, 0];
      if (revealed) players.forEach(p => { if (p.answer !== null) counts[p.answer]++; });
      const isLast = qIndex === QUESTIONS.length - 1;
      render(`<div class="screen">
        <div class="q-top">
          <span class="pill">${bi(`سؤال ${qIndex + 1} من ${QUESTIONS.length}`, `Question ${qIndex + 1} of ${QUESTIONS.length}`)}</span>
          ${revealed ? `<span class="pill">${bi('الإجابة الصحيحة', 'Correct answer')}</span>` : `
          <div class="ring" id="ring">
            <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="10"/>
            <circle class="prog" id="ringProg" cx="50" cy="50" r="44" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg>
            <span id="tNum">15</span>
          </div>`}
          <span class="pill"><span id="ansCount" dir="ltr">${[...players.values()].filter(p => p.answer !== null).length} / ${connected().length}</span>${bi('أجابوا', 'answered')}</span>
        </div>
        <div class="q-card">${bi(esc(q.ar), esc(q.en))}</div>
        <div class="opts">
          ${q.options.map((o, i) => `<div class="opt c${i} ${revealed ? (i === q.correct ? 'right' : 'dim') : ''}">
            <span class="shape">${SHAPES[i]}</span>${bi(esc(o[0]), esc(o[1]))}
            ${revealed ? `<span class="cnt">${counts[i]}</span>` : ''}</div>`).join('')}
        </div>
        ${revealed ? `<div class="fact"><span style="font-size:1.6rem">💡</span>${bi(esc(q.fact[0]), esc(q.fact[1]))}</div>` : ''}
        <div class="host-actions">
          ${revealed
            ? `<button class="btn" id="boardBtn">${bi('عرض المتصدرين', 'Show leaderboard')}</button>`
            : `<button class="btn ghost" id="revealBtn">${bi('كشف الإجابة الآن', 'Reveal answer now')}</button>`}
        </div>
      </div>`);
      if (revealed) $('#boardBtn').addEventListener('click', renderBoard);
      else $('#revealBtn').addEventListener('click', reveal);
    }

    function renderBoard() {
      phase = 'board';
      const ranked = ranking();
      const top = ranked.slice(0, 5);
      const isLast = qIndex === QUESTIONS.length - 1;
      render(`<div class="screen">
        <h2 class="board-title center">${bi('🔥 المتصدرون', 'Leaderboard')}</h2>
        <ol class="board">
          ${top.map((p, i) => {
            const moved = p.prevRank && p.prevRank > i + 1 ? `<span class="move">▲ ${p.prevRank - (i + 1)}</span>` : '';
            return `<li class="row r${i + 1}"><span class="rank">${i + 1}</span><span class="nm">${esc(p.name)}</span>${moved}
              ${p.lastPoints ? `<span class="gain">+${p.lastPoints}</span>` : ''}<span class="pts">${p.score}</span></li>`;
          }).join('')}
        </ol>
        ${ranked.length > 5 ? `<p class="center" style="opacity:.8">${bi(`و ${ranked.length - 5} لاعبين آخرين`, `and ${ranked.length - 5} more players`)}</p>` : ''}
        <div class="host-actions">
          <button class="btn" id="nextBtn">${isLast ? bi('النتائج النهائية 🏆', 'Final results') : bi('السؤال التالي', 'Next question')}</button>
        </div>
      </div>`);
      $('#nextBtn').addEventListener('click', nextQuestion);
    }

    function finish() {
      phase = 'final';
      clearInterval(timerId);
      const ranked = ranking();
      ranked.forEach(p => sendFinal(p, ranked));
      const [w, s, t] = ranked;
      const place = (p, cls, n) => p ? `<div class="place ${cls}">
          ${n === 1 ? '<div class="crown">👑</div>' : ''}
          <div class="pname">${esc(p.name)}</div><div class="pscore">${p.score}</div>
          <div class="block">${n}</div></div>` : `<div class="place ${cls}"></div>`;
      render(`<div class="screen">
        <div class="win-head">
          <div class="trophy">🏆</div>
          <h2>${bi('الفائز بالمركز الأول', 'First place winner')}</h2>
          <div class="winner-name">${w ? esc(w.name) : '—'}</div>
          <div class="pill" style="direction:ltr">${w ? w.score : 0} ${bi('نقطة', 'points')}</div>
        </div>
        <div class="podium">${place(s, 'p2', 2)}${place(w, 'p1', 1)}${place(t, 'p3', 3)}</div>
        <div class="card all-list">
          <h3>${bi('جميع المشاركين ونقاطهم', 'All participants and scores')}</h3>
          <ol>${ranked.map((p, i) => `<li><span class="rank" style="width:36px;height:36px">${i + 1}</span><span class="nm">${esc(p.name)}</span><span class="pts">${p.score}</span></li>`).join('')}</ol>
        </div>
        <div class="host-actions"><button class="btn" id="againBtn">${bi('العب مرة أخرى', 'Play again')}</button></div>
      </div>`);
      $('#againBtn').addEventListener('click', () => {
        phase = 'lobby'; qIndex = -1;
        players.forEach(p => { p.score = 0; p.rank = null; p.prevRank = null; p.answer = null; });
        players.forEach(p => send(p, { type: 'lobby' }));
        renderLobby();
      });
      confetti(7000);
    }

    function sendFinal(p, ranked) {
      send(p, { type: 'final', rank: ranked.indexOf(p) + 1, score: p.score, total: ranked.length, winner: ranked[0] ? ranked[0].name : '' });
    }
  }

  // =====================================================
  //                       PLAYER
  // =====================================================
  function initPlayer(room) {
    let peer = null, conn = null, myName = '', myScore = 0, joined = false;
    let timerId = null, qLocalStart = 0, qOffset = 0, currentQ = null, answered = false;
    let connectTimeout = null;

    const PID_KEY = 'fm-pid-' + room;
    let pid = null;
    try { pid = localStorage.getItem(PID_KEY); } catch (e) {}
    if (!pid) {
      pid = Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
      try { localStorage.setItem(PID_KEY, pid); } catch (e) {}
    }
    let savedName = '';
    try { savedName = localStorage.getItem('fm-name') || ''; } catch (e) {}

    if (!libsOk()) return;
    renderJoin();

    function renderJoin(errHtml = '') {
      render(`<div class="screen player p-join">
        <div class="logo">🏢</div>
        <h1>${bi('تحدي إدارة المرافق', 'Facilities Management Challenge')}</h1>
        <div class="card">
          <label for="nameIn">${bi('اكتب اسمك', 'Enter your name')}</label>
          <input id="nameIn" maxlength="20" autocomplete="nickname" placeholder="الاسم / Name" value="${esc(savedName)}">
          <button class="btn big" id="joinBtn">${bi('دخول', 'Join')}</button>
          <p class="err" id="err">${errHtml}</p>
        </div>
        <p class="center" style="opacity:.8;margin-top:18px">${bi('رمز الغرفة', 'Room code')}: <b dir="ltr">${esc(room)}</b></p>
      </div>`);
      const input = $('#nameIn');
      const go = () => {
        const name = input.value.trim().replace(/\s+/g, ' ');
        if (!name) { $('#err').innerHTML = bi('الرجاء كتابة اسمك', 'Please enter your name'); input.focus(); return; }
        savedName = name;
        try { localStorage.setItem('fm-name', name); } catch (e) {}
        $('#joinBtn').disabled = true;
        $('#err').innerHTML = `<span style="color:var(--muted)">${bi('جاري الاتصال…', 'Connecting…')}</span>`;
        connect(name);
      };
      $('#joinBtn').addEventListener('click', go);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    }

    function failJoin(html) {
      clearTimeout(connectTimeout);
      try { if (peer) peer.destroy(); } catch (e) {}
      peer = null; conn = null;
      renderJoin(html);
    }

    function connect(name) {
      clearTimeout(connectTimeout);
      try { if (peer) peer.destroy(); } catch (e) {}
      peer = new Peer({ debug: 0 });
      connectTimeout = setTimeout(() => {
        failJoin(bi('تعذّر الاتصال باللعبة. تأكد من الإنترنت وحاول مجدداً.', 'Could not reach the game. Check your connection and try again.'));
      }, 15000);
      peer.on('open', () => {
        conn = peer.connect(PREFIX + room, { reliable: true });
        conn.on('open', () => conn.send({ type: 'join', pid, name }));
        conn.on('data', onMsg);
        conn.on('close', onLost);
      });
      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
          failJoin(bi('لم يتم العثور على اللعبة. تأكد من الباركود أو الرابط.', 'Game not found. Check the QR code or link.'));
        } else if (!joined) {
          failJoin(bi('حدث خطأ في الاتصال، حاول مجدداً.', 'Connection error, please try again.'));
        } else onLost();
      });
    }

    function onLost() {
      if (!joined) return;
      joined = false;
      clearInterval(timerId);
      render(`<div class="screen player waiting">
        <div class="emoji">📡</div>
        <h2>${bi('انقطع الاتصال', 'Connection lost')}</h2>
        <p>${bi('نقاطك محفوظة، أعد الاتصال للمتابعة.', 'Your points are saved. Reconnect to continue.')}</p>
        <button class="btn" id="reBtn">${bi('إعادة الاتصال', 'Reconnect')}</button>
      </div>`);
      $('#reBtn').addEventListener('click', () => {
        $('#reBtn').disabled = true;
        connect(myName || savedName);
      });
    }

    function onMsg(msg) {
      if (!msg || typeof msg !== 'object') return;
      switch (msg.type) {
        case 'error':
          if (msg.code === 'name') failJoin(bi('هذا الاسم مستخدم، اختر اسماً آخر', 'This name is taken, choose another'));
          break;
        case 'welcome':
          clearTimeout(connectTimeout);
          joined = true; myName = msg.name; myScore = msg.score || 0;
          break;
        case 'lobby': myScore = 0; showWaiting('lobby'); break;
        case 'wait': showWaiting('next'); break;
        case 'question': showQuestion(msg); break;
        case 'result': showResult(msg); break;
        case 'final': showFinal(msg); break;
      }
    }

    function showWaiting(kind) {
      clearInterval(timerId);
      const txt = kind === 'lobby'
        ? [bi('أنت في اللعبة!', 'You\'re in!'), bi('بانتظار المضيف لبدء اللعبة', 'Waiting for the host to start'), '🎮']
        : [bi('استعد!', 'Get ready!'), bi('السؤال التالي قادم', 'Next question is coming'), '⏳'];
      render(`<div class="screen player waiting">
        <div class="emoji">${txt[2]}</div>
        <h2>${txt[0]}</h2>
        <p class="dots">${txt[1]}</p>
        <div class="you">${esc(myName)}</div>
      </div>`);
    }

    function showQuestion(msg) {
      clearInterval(timerId);
      currentQ = msg; answered = false;
      qLocalStart = performance.now();
      qOffset = DURATION - msg.remaining;
      render(`<div class="screen player">
        <div class="p-top">
          <span class="pill" dir="ltr">${msg.n} / ${msg.total}</span>
          <span class="pill"><b dir="ltr">${myScore}</b> ${bi('نقطة', 'pts')}</span>
        </div>
        <div class="tbar"><div class="tfill" id="tfill"></div></div>
        <div class="tnum" id="tnum">${Math.ceil(msg.remaining / 1000)}</div>
        <div class="q-card">${bi(esc(msg.ar), esc(msg.en))}</div>
        <div class="p-opts" id="pOpts">
          ${msg.options.map((o, i) => `<button class="opt p-opt c${i}" data-i="${i}"><span class="shape">${SHAPES[i]}</span>${bi(esc(o[0]), esc(o[1]))}</button>`).join('')}
        </div>
        <p class="p-note" id="pNote"></p>
      </div>`);
      document.querySelectorAll('.p-opt').forEach(btn => btn.addEventListener('click', () => answer(Number(btn.dataset.i), btn)));
      timerId = setInterval(tickPlayer, 100);
      tickPlayer();
    }

    function elapsed() { return qOffset + (performance.now() - qLocalStart); }

    function tickPlayer() {
      const left = Math.max(0, DURATION - elapsed());
      const fill = $('#tfill'), num = $('#tnum');
      if (fill) { fill.style.width = (left / DURATION * 100) + '%'; fill.classList.toggle('low', left <= 5000); }
      if (num) num.textContent = Math.ceil(left / 1000);
      if (left <= 0) {
        clearInterval(timerId);
        if (!answered) lockOptions(bi('انتهى الوقت! بانتظار النتيجة…', 'Time\'s up! Waiting for results…'));
      }
    }

    function lockOptions(note) {
      document.querySelectorAll('.p-opt').forEach(b => { b.disabled = true; });
      const box = $('#pOpts'); if (box) box.classList.add('locked');
      const n = $('#pNote'); if (n) n.innerHTML = note;
    }

    function answer(i, btn) {
      if (answered || !currentQ || elapsed() >= DURATION) return;
      answered = true;
      btn.classList.add('picked');
      lockOptions(bi('تم إرسال إجابتك ✔ بانتظار الآخرين…', 'Answer sent ✔ Waiting for others…'));
      try { conn.send({ type: 'answer', q: currentQ.q, choice: i, elapsed: Math.round(elapsed()) }); } catch (e) {}
    }

    function showResult(msg) {
      clearInterval(timerId);
      myScore = msg.score;
      const kind = !msg.answered ? 'none' : msg.isCorrect ? 'good' : 'bad';
      const m = kind === 'good' ? pick(MSG_RIGHT) : kind === 'bad' ? pick(MSG_WRONG) : MSG_NONE;
      const icon = kind === 'good' ? '✔' : kind === 'bad' ? '✖' : '⏰';
      render(`<div class="screen player">
        <div class="result ${kind}">
          <div class="big-icon">${icon}</div>
          <h2>${bi(m[0], m[1], 'center')}</h2>
          <div class="gainbig">+${msg.points}</div>
          <div class="stats">
            <div class="stat">${bi('مجموعك', 'Your total')}<b>${msg.score}</b></div>
            <div class="stat">${bi('ترتيبك', 'Your rank')}<b>${msg.rank} / ${msg.total}</b></div>
          </div>
        </div>
        <div class="answer-box">
          <small>${bi('الإجابة الصحيحة', 'Correct answer')}</small>
          <b>${bi(esc(msg.correct[0]), esc(msg.correct[1]))}</b>
        </div>
        <p class="center" style="margin-top:14px">${bi('المتصدر حالياً', 'Current leader')}: <b>${esc(msg.leader)}</b> ${msg.rank === 1 ? '— ' + bi('هذا أنت! 🔥', 'That\'s you!') : ''}</p>
      </div>`);
      if (kind === 'good' && msg.rank === 1) confetti(1800);
    }

    function showFinal(msg) {
      clearInterval(timerId);
      const isWinner = msg.rank === 1;
      render(`<div class="screen player waiting">
        <div class="emoji">${isWinner ? '🏆' : msg.rank <= 3 ? ['🥇','🥈','🥉'][msg.rank - 1] : '🎉'}</div>
        <h2>${isWinner ? bi('مبروك! أنت البطل!', 'Congratulations! You\'re the champion!') : bi('انتهت اللعبة!', 'Game over!')}</h2>
        <div class="stats" style="max-width:360px;margin:18px auto">
          <div class="stat">${bi('مركزك', 'Your place')}<b>${msg.rank} / ${msg.total}</b></div>
          <div class="stat">${bi('نقاطك', 'Your points')}<b>${msg.score}</b></div>
        </div>
        ${isWinner ? '' : `<p>${bi('الفائز', 'Winner')}: <b>${esc(msg.winner)}</b> 👑</p>`}
        <p>${bi('شكراً لمشاركتك في تحدي إدارة المرافق!', 'Thanks for playing the FM Challenge!')}</p>
      </div>`);
      if (isWinner) confetti(6000);
    }
  }
})();
</script>
</body>
</html>
